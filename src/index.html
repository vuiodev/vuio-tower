<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VuIO Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="settings-container">
      <header class="header">
        <h1 class="title">VuIO Settings</h1>
        <p class="subtitle">Configure your DLNA media server parameters</p>
      </header>

      <form id="settings-form">
        <div class="form-group">
          <label for="server-name">Friendly Server Name</label>
          <input type="text" id="server-name" placeholder="e.g. My Media Server" required />
        </div>

        <div class="form-group">
          <label for="server-port">Network Port</label>
          <input type="number" id="server-port" min="1024" max="65535" placeholder="8080" required />
        </div>

        <div class="form-group">
          <label>Monitored Media Folders</label>
          <div class="folders-list" id="folders-list">
            <!-- Dynamically populated -->
          </div>
          <button type="button" class="btn btn-add" id="btn-add-folder">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Add Media Folder
          </button>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Save Settings</button>
        </div>
      </form>
    </main>
  </body>
</html>
