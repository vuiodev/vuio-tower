name: CI & Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Which part of the workflow to run'
        type: choice
        options:
          - test
          - release
        required: true
        default: 'test'
      tag_name:
        description: 'Tag for manual release (e.g. v0.1.0)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Rustfmt
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vuio-tower
        uses: actions/checkout@v4
        with:
          path: vuio-tower

      - name: Checkout sibling vuio for local dev path resolution during linting
        uses: actions/checkout@v4
        with:
          repository: vuiodev/vuio
          path: vuio

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        working-directory: vuio-tower
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    name: Test
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vuio-tower
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Patch vuio-core dependency
        shell: bash
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/vuiodev/vuio/releases/latest | jq -r .tag_name // empty)
          export LATEST_TAG
          python3 -c "
          import os, re
          tag = os.environ.get('LATEST_TAG', '').strip()
          file_path = 'src-tauri/Cargo.toml'
          with open(file_path, 'r') as f:
              content = f.read()

          if tag and tag != 'null':
              print(f'Patching Cargo.toml to use release tag: {tag}')
              replacement = f'git = \"https://github.com/vuiodev/vuio.git\", tag = \"{tag}\"'
          else:
              print('No release tag found; patching Cargo.toml to use main branch')
              replacement = 'git = \"https://github.com/vuiodev/vuio.git\", branch = \"main\"'

          content = re.sub(r'path\s*=\s*\"\.\./\.\./vuio/crates/vuio-core\"', replacement, content)
          with open(file_path, 'w') as f:
              f.write(content)
          "
          cat src-tauri/Cargo.toml

      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-macos:
    name: Build macOS Universal App & DMG
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Patch vuio-core dependency
        shell: bash
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/vuiodev/vuio/releases/latest | jq -r .tag_name // empty)
          export LATEST_TAG
          python3 -c "
          import os, re
          tag = os.environ.get('LATEST_TAG', '').strip()
          file_path = 'src-tauri/Cargo.toml'
          with open(file_path, 'r') as f:
              content = f.read()

          if tag and tag != 'null':
              print(f'Patching Cargo.toml to use release tag: {tag}')
              replacement = f'git = \"https://github.com/vuiodev/vuio.git\", tag = \"{tag}\"'
          else:
              print('No release tag found; patching Cargo.toml to use main branch')
              replacement = 'git = \"https://github.com/vuiodev/vuio.git\", branch = \"main\"'

          content = re.sub(r'path\s*=\s*\"\.\./\.\./vuio/crates/vuio-core\"', replacement, content)
          with open(file_path, 'w') as f:
              f.write(content)
          "
          cat src-tauri/Cargo.toml

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Universal macOS App & DMG
        run: npx tauri build --target universal-apple-darwin

      - name: Package macOS artifacts
        shell: bash
        run: |
          mkdir -p release-out
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -exec cp {} release-out/vuio-tower-macos-universal.dmg \;
          if [ -d "src-tauri/target/universal-apple-darwin/release/bundle/macos/VuIO Tower.app" ]; then
            tar -czf release-out/vuio-tower-macos-universal.tar.gz -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "VuIO Tower.app"
          fi
          ls -la release-out/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-macos-universal
          path: release-out/*

  build-windows:
    name: Build Windows Standalone Executable (${{ matrix.arch }})
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Patch vuio-core dependency
        shell: bash
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/vuiodev/vuio/releases/latest | jq -r .tag_name // empty)
          export LATEST_TAG
          python3 -c "
          import os, re
          tag = os.environ.get('LATEST_TAG', '').strip()
          file_path = 'src-tauri/Cargo.toml'
          with open(file_path, 'r') as f:
              content = f.read()

          if tag and tag != 'null':
              print(f'Patching Cargo.toml to use release tag: {tag}')
              replacement = f'git = \"https://github.com/vuiodev/vuio.git\", tag = \"{tag}\"'
          else:
              print('No release tag found; patching Cargo.toml to use main branch')
              replacement = 'git = \"https://github.com/vuiodev/vuio.git\", branch = \"main\"'

          content = re.sub(r'path\s*=\s*\"\.\./\.\./vuio/crates/vuio-core\"', replacement, content)
          with open(file_path, 'w') as f:
              f.write(content)
          "
          cat src-tauri/Cargo.toml

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Windows binary
        run: npx tauri build --target ${{ matrix.target }} --no-bundle

      - name: Package Windows executable
        shell: bash
        run: |
          mkdir -p release-out
          ASSET_NAME="vuio-tower-windows-${{ matrix.arch }}.zip"
          powershell Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/vuio-tower.exe" -DestinationPath "release-out/$ASSET_NAME"
          ls -la release-out/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-windows-${{ matrix.arch }}
          path: release-out/*

  build-linux:
    name: Build Linux Binary (${{ matrix.arch }})
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure cross-linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Patch vuio-core dependency
        shell: bash
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/vuiodev/vuio/releases/latest | jq -r .tag_name // empty)
          export LATEST_TAG
          python3 -c "
          import os, re
          tag = os.environ.get('LATEST_TAG', '').strip()
          file_path = 'src-tauri/Cargo.toml'
          with open(file_path, 'r') as f:
              content = f.read()

          if tag and tag != 'null':
              print(f'Patching Cargo.toml to use release tag: {tag}')
              replacement = f'git = \"https://github.com/vuiodev/vuio.git\", tag = \"{tag}\"'
          else:
              print('No release tag found; patching Cargo.toml to use main branch')
              replacement = 'git = \"https://github.com/vuiodev/vuio.git\", branch = \"main\"'

          content = re.sub(r'path\s*=\s*\"\.\./\.\./vuio/crates/vuio-core\"', replacement, content)
          with open(file_path, 'w') as f:
              f.write(content)
          "
          cat src-tauri/Cargo.toml

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Linux binary
        run: npx tauri build --target ${{ matrix.target }} --no-bundle

      - name: Package Linux artifact
        shell: bash
        run: |
          mkdir -p release-out
          ASSET_NAME="vuio-tower-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "release-out/$ASSET_NAME" -C "src-tauri/target/${{ matrix.target }}/release" "vuio-tower"
          ls -la release-out/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-linux-${{ matrix.arch }}
          path: release-out/*

  create-release:
    name: Create GitHub Release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          draft: true
          files: release-artifacts/*/*
