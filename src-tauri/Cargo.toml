[package]
name = "vuio-tower"
version = "0.0.1"
description = "Desktop host for the VuIO media server"
authors = ["vyrti"]
edition = "2021"
[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
toml = "1.1"
toml_edit = "0.25"
dirs = "6.0"
vuio-core = { git = "https://github.com/vuiodev/vuio", rev = "77e3dee", features = ["unstable-internals"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
strip = true
overflow-checks = false
